kind = "web"
previewPath = "/"
title = "Interview Coach AI"
description = "A responsive interview-practice web app for students preparing for job interviews, with a dashboard, mock interview flow, feedback, personalized study recommendations, history, settings, help, and about pages."
version = "1.0.0"
id = "artifacts/interview-coach-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21371

[services.development]
run = "pnpm --filter @workspace/interview-coach-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interview-coach-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/interview-coach-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21371"
BASE_PATH = "/"
